services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./www:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sungsan}
      MYSQL_USER: ${MYSQL_USER:-sungsan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sungsan_dev_password}
      PHP_SESSION_COOKIE_SECURE: ${PHP_SESSION_COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sungsan}
      MYSQL_USER: ${MYSQL_USER:-sungsan}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sungsan_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sungsan_root_password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-sungsan_root_password}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
